name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            distro: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build pkg-config \
            libfprint-2-dev libglib2.0-dev libgusb-dev \
            libnss3-dev libssl-dev libcairo2-dev \
            gobject-introspection libgirepository1.0-dev \
            libopencv-dev gtk-doc-tools dpkg-dev

      - name: Build
        run: |
          cd libfprint
          meson setup builddir --prefix=/usr -Ddrivers=goodixtls55x4 -Dudev_rules=disabled -Ddoc=false
          ninja -C builddir

      - name: Test
        run: |
          meson test -C libfprint/builddir --suite unit-tests --print-errorlogs
          python3 tools/test-psk-autofix.py

      - name: Package .deb
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./tools/build-deb.sh libfprint/builddir "$RELEASE_VERSION" "${{ matrix.distro }}" "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.distro }}
          path: |
            goodix-gf32xx-driver_*.deb
            SHA256SUMS
          if-no-files-found: error

  release:
    needs: build-deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: pkgs
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pkgs/*.deb
            pkgs/SHA256SUMS
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
